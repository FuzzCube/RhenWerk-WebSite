name: monitoring
services:
  beszel:
    image: henrygd/beszel:0.21.1
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    security_opt: [no-new-privileges:true]
    ports: ["127.0.0.1:18090:8090"]
    environment:
      APP_URL: https://monitor.rheinwerk-service.online
    volumes:
      - ./beszel-data:/beszel_data
      - ./beszel-socket:/beszel_socket
    healthcheck:
      test: [CMD, /beszel, health, --url, "http://localhost:8090"]
      interval: 60s
      timeout: 5s
      retries: 3
  agent:
    image: henrygd/beszel-agent:0.21.1
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    network_mode: host
    security_opt: [no-new-privileges:true]
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://127.0.0.1:18090
      KEY: ${BESZEL_KEY:?Set BESZEL_KEY}
      TOKEN: ${BESZEL_TOKEN:?Set BESZEL_TOKEN}
    volumes:
      - ./agent-data:/var/lib/beszel-agent
      - ./beszel-socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: [CMD, /agent, health]
      interval: 60s
      timeout: 5s
      retries: 3
  kuma:
    image: louislam/uptime-kuma:2.5.7-slim
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
    security_opt: [no-new-privileges:true]
    network_mode: host
    environment:
      UPTIME_KUMA_HOST: 127.0.0.1
      UPTIME_KUMA_PORT: 13001
      UPTIME_KUMA_DB_TYPE: sqlite
    volumes:
      - ./kuma-data:/app/data
  tunnel:
    image: cloudflare/cloudflared:2026.10.3
    profiles: [public]
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.5
    network_mode: host
    security_opt: [no-new-privileges:true]
    environment:
      TUNNEL_TOKEN: ${MONITORING_TUNNEL_TOKEN:-}
    command: tunnel --no-autoupdate run
